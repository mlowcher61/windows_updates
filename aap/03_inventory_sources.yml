---
- name: Create AAP inventory and SCM source
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/ansible.controller.controller:
      # Host and auth are injected by the Red Hat Ansible Automation Platform
      # credential attached to the job template (CONTROLLER_HOST /
      # CONTROLLER_USERNAME / CONTROLLER_PASSWORD).
      validate_certs: "{{ aap_validate_certs | default(false) }}"
      # Without this, the collection's HTTP calls have no ceiling: a request
      # that stalls mid-run blocks the job indefinitely instead of failing.
      # Raise it with -e aap_request_timeout=<seconds> for very large runs.
      request_timeout: "{{ aap_request_timeout | default(60) }}"
  tasks:
    - name: Inventory windows_servers
      ansible.controller.inventory:
        name: windows_servers
        organization: Default
        description: All Windows servers managed by AAP

    - name: Inventory source from project
      ansible.controller.inventory_source:
        name: windows_servers_scm
        inventory: windows_servers
        organization: Default
        source: scm
        source_project: windows_updates
        source_path: inventories/production/hosts.yml
        update_on_launch: true
        overwrite: true
        overwrite_vars: true

---
# Custom credential types. Per user preference, all sensitive values live in
# AAP — never in vaulted git files.
- name: Create custom credential types
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/ansible.platform.controller:
      controller_host: "{{ aap_hostname }}"
      controller_username: "{{ aap_username }}"
      controller_password: "{{ aap_password }}"
      validate_certs: "{{ aap_validate_certs | default(false) }}"
  tasks:
    - name: windows_winrm_kerberos credential type
      ansible.platform.credential_type:
        name: windows_winrm_kerberos
        description: WinRM via Kerberos for domain-joined Windows servers
        kind: cloud
        inputs:
          fields:
            - id: username
              type: string
              label: Service Account
            - id: password
              type: string
              label: Password
              secret: true
            - id: domain
              type: string
              label: Active Directory Domain
            - id: kerberos_realm
              type: string
              label: Kerberos Realm
          required: [username, password, domain]
        injectors:
          extra_vars:
            ansible_user: "{% raw %}{{ username }}@{{ domain | upper }}{% endraw %}"
            ansible_password: "{% raw %}{{ password }}{% endraw %}"
            ansible_winrm_kerberos_realm: "{% raw %}{{ kerberos_realm }}{% endraw %}"

    - name: wsus_source credential type
      ansible.platform.credential_type:
        name: wsus_source
        description: WSUS server override for ansible.windows.win_updates
        kind: cloud
        inputs:
          fields:
            - id: wsus_url
              type: string
              label: WSUS Server URL
            - id: wsus_proxy
              type: string
              label: Proxy (optional)
        injectors:
          extra_vars:
            wsus_server_url: "{% raw %}{{ wsus_url }}{% endraw %}"
            wsus_proxy: "{% raw %}{{ wsus_proxy | default('') }}{% endraw %}"

    - name: smtp_relay credential type
      ansible.platform.credential_type:
        name: smtp_relay
        description: SMTP relay for report email delivery
        kind: cloud
        inputs:
          fields:
            - id: smtp_host
              type: string
              label: SMTP Host
            - id: smtp_port
              type: string
              label: SMTP Port
            - id: smtp_user
              type: string
              label: Username
            - id: smtp_password
              type: string
              label: Password
              secret: true
            - id: from_address
              type: string
              label: From Address
          required: [smtp_host, from_address]
        injectors:
          extra_vars:
            smtp_host: "{% raw %}{{ smtp_host }}{% endraw %}"
            smtp_port: "{% raw %}{{ smtp_port | default('25') }}{% endraw %}"
            smtp_user: "{% raw %}{{ smtp_user | default('') }}{% endraw %}"
            smtp_password: "{% raw %}{{ smtp_password | default('') }}{% endraw %}"
            smtp_from: "{% raw %}{{ from_address }}{% endraw %}"

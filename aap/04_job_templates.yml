---
- name: Create job templates
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/ansible.controller.controller:
      # Host and auth are injected by the Red Hat Ansible Automation Platform
      # credential attached to the job template (CONTROLLER_HOST /
      # CONTROLLER_USERNAME / CONTROLLER_PASSWORD).
      validate_certs: "{{ aap_validate_certs | default(false) }}"
      # Without this, the collection's HTTP calls have no ceiling: a request
      # that stalls mid-run blocks the job indefinitely instead of failing.
      # Raise it with -e aap_request_timeout=<seconds> for very large runs.
      request_timeout: "{{ aap_request_timeout | default(60) }}"
  tasks:
    - name: JT — Windows Patch — Scan
      ansible.controller.job_template:
        name: "Windows Patch — Scan"
        organization: Systems
        project: Windows_Updates
        inventory: "{{ aap_inventory_name | default('AWS Inventory') }}"
        playbook: playbooks/01_scan.yml
        credentials: [cred_winrm_prod]
        execution_environment: windows_patching_ee
        ask_variables_on_launch: true
        survey_enabled: true
        survey_spec:
          name: Scan options
          description: Override scan target group
          spec:
            - question_name: Target group
              variable: target_group
              type: multiplechoice
              choices: ["windows_servers", "prod", "dev", "sensitive"]
              default: windows_servers
              required: true

    - name: JT — Windows Patch — Install
      ansible.controller.job_template:
        name: "Windows Patch — Install"
        organization: Systems
        project: Windows_Updates
        inventory: "{{ aap_inventory_name | default('AWS Inventory') }}"
        playbook: playbooks/02_install.yml
        credentials: [cred_winrm_prod, cred_wsus_corporate]
        execution_environment: windows_patching_ee
        ask_limit_on_launch: true
        ask_variables_on_launch: true
        survey_enabled: true
        survey_spec:
          name: Install options
          description: Override install behaviour for this run
          spec:
            - question_name: Target group
              variable: target_group
              type: multiplechoice
              choices: ["prod", "dev"]
              default: dev
              required: true
            - question_name: Serial batch size
              variable: install_serial
              type: text
              default: "20%"
              required: false
            - question_name: Override categories (comma-separated)
              variable: install_categories_override
              type: text
              default: ""
              required: false

    # cred_report_host_ssh is what lets the second play in 03_report.yml reach the
    # web host. Without it the reports render inside the EE container and die
    # with it.
    - name: JT — Windows Patch — Report
      ansible.controller.job_template:
        name: "Windows Patch — Report"
        organization: Systems
        project: Windows_Updates
        inventory: "{{ aap_inventory_name | default('AWS Inventory') }}"
        playbook: playbooks/03_report.yml
        credentials: [cred_smtp_relay, cred_report_host_ssh]
        execution_environment: windows_patching_ee
        ask_variables_on_launch: true
        survey_enabled: true
        survey_spec:
          name: Report distribution
          description: Who receives the report email, and where it is published
          spec:
            - question_name: Recipient list (comma-separated emails)
              variable: report_recipients_raw
              type: text
              default: "mlowcher@redhat.com"
              required: true
            # Selects the report server out of the inventory attached above.
            # Must be a survey answer, not a group_vars entry: the publish play
            # templates this into its `hosts:` line at parse time, and the
            # controller's own inventory does not read group_vars from this repo.
            - question_name: Report web host (group or host in AWS Inventory)
              variable: report_web_host
              type: text
              default: "report_hosts"
              required: true
            # Consumed by the publish play in THIS playbook, which is why it is
            # asked here and not on the Set Up Report Host template.
            - question_name: Report runs to keep on the web host (0 = keep all)
              variable: report_site_retention_count
              type: integer
              default: 4
              required: true

    # Stands up nginx on the report web host. Run once before the first Report
    # job; idempotent, so re-running just reconciles drift.
    - name: JT — Windows Patch — Set Up Report Host
      ansible.controller.job_template:
        name: "Windows Patch — Set Up Report Host"
        organization: Systems
        project: Windows_Updates
        inventory: "{{ aap_inventory_name | default('AWS Inventory') }}"
        playbook: playbooks/04_setup_report_host.yml
        credentials: [cred_report_host_ssh]
        execution_environment: windows_patching_ee
        ask_limit_on_launch: true
        ask_variables_on_launch: true
        survey_enabled: true
        survey_spec:
          name: Report host options
          description: Which host serves reports, and how the site is exposed
          spec:
            # Same variable the Report template asks for, so both templates
            # target the same box. Without it this play could only ever reach a
            # group literally named report_hosts.
            - question_name: Report web host (group or host in AWS Inventory)
              variable: report_web_host
              type: text
              default: "report_hosts"
              required: true
            - question_name: Listen port
              variable: report_site_port
              type: integer
              default: 8888
              required: true

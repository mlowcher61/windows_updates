---
- name: Create AAP project
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/ansible.controller.controller:
      # Host and auth are injected by the Red Hat Ansible Automation Platform
      # credential attached to the job template (CONTROLLER_HOST /
      # CONTROLLER_USERNAME / CONTROLLER_PASSWORD).
      validate_certs: "{{ aap_validate_certs | default(false) }}"
      # Without this, the collection's HTTP calls have no ceiling: a request
      # that stalls mid-run blocks the job indefinitely instead of failing.
      # Raise it with -e aap_request_timeout=<seconds> for very large runs.
      request_timeout: "{{ aap_request_timeout | default(60) }}"
  tasks:
    - name: windows_updates project (SCM)
      ansible.controller.project:
        name: windows_updates
        description: Windows Server patching and posture reporting
        organization: Default
        scm_type: git
        scm_url: "{{ project_scm_url | default('https://github.com/mlowcher61/windows_updates.git') }}"
        scm_branch: main
        scm_update_on_launch: true
        scm_clean: true

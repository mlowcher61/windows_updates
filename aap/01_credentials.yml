---
# Credential SHELLS only — actual values entered by admin via AAP UI after deploy.
- name: Create credential shells
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/ansible.controller.controller:
      # Host and auth are injected by the Red Hat Ansible Automation Platform
      # credential attached to the job template (CONTROLLER_HOST /
      # CONTROLLER_USERNAME / CONTROLLER_PASSWORD).
      validate_certs: "{{ aap_validate_certs | default(false) }}"
      # Without this, the collection's HTTP calls have no ceiling: a request
      # that stalls mid-run blocks the job indefinitely instead of failing.
      # Raise it with -e aap_request_timeout=<seconds> for very large runs.
      request_timeout: "{{ aap_request_timeout | default(60) }}"
  tasks:
    - name: cred_winrm_prod
      ansible.controller.credential:
        name: cred_winrm_prod
        credential_type: windows_winrm_kerberos
        organization: Default
        inputs:
          username: PLACEHOLDER
          password: PLACEHOLDER
          domain: EXAMPLE.COM

    - name: cred_winrm_dev
      ansible.controller.credential:
        name: cred_winrm_dev
        credential_type: windows_winrm_kerberos
        organization: Default
        inputs:
          username: PLACEHOLDER
          password: PLACEHOLDER
          domain: EXAMPLE.COM

    - name: cred_wsus_corporate
      ansible.controller.credential:
        name: cred_wsus_corporate
        credential_type: wsus_source
        organization: Default
        inputs:
          wsus_url: ""

    - name: cred_smtp_relay
      ansible.controller.credential:
        name: cred_smtp_relay
        credential_type: smtp_relay
        organization: Default
        inputs:
          smtp_host: smtp.example.com
          smtp_port: "25"
          from_address: aap-patching@example.com

    # SSH to the Linux host that serves the posture reports. A stock Machine
    # credential rather than a custom type: the built-in one already carries an
    # SSH key and privilege-escalation settings, and both the Report job (to
    # publish) and the Set Up Report Host job (to install nginx) need sudo there.
    # Paste the private key into this credential in the AAP UI after deploy —
    # never into git.
    - name: cred_report_host_ssh
      ansible.controller.credential:
        name: cred_report_host_ssh
        credential_type: Machine
        organization: Default
        inputs:
          username: ec2-user
          become_method: sudo

---
# Deploys all AAP objects for this solution in order.
# Requires a Red Hat Ansible Automation Platform credential attached to the job
# template that runs this playbook. It injects CONTROLLER_HOST,
# CONTROLLER_USERNAME and CONTROLLER_PASSWORD into the environment, which the
# ansible.controller modules read automatically -- no extra-vars needed.
- import_playbook: 00_credential_types.yml
- import_playbook: 01_credentials.yml
# - import_playbook: 02_project.yml
# No inventory CaC here on purpose. The inventory is supplied outside this
# repo ("AWS Inventory") and attached to the job templates by name — see
# aap_inventory_name in 04_job_templates.yml. The old 03_inventory_sources.yml
# built a controller inventory from inventories/production/hosts.yml, which is
# now a local ansible-core convenience only.
- import_playbook: 04_job_templates.yml
- import_playbook: 05_workflow_template.yml
- import_playbook: 06_notification_templates.yml
- import_playbook: 07_schedules.yml

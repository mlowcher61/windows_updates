# - import_playbook: 02_project.yml
# - import_playbook: 03_inventory_sources.yml
- import_playbook: 04_job_templates.yml
- import_playbook: 05_workflow_template.yml
- import_playbook: 06_notification_templates.yml
- import_playbook: 07_schedules.yml

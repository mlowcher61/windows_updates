---
- name: Notification templates
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/ansible.controller.controller:
      # Host and auth are injected by the Red Hat Ansible Automation Platform
      # credential attached to the job template (CONTROLLER_HOST /
      # CONTROLLER_USERNAME / CONTROLLER_PASSWORD).
      validate_certs: "{{ aap_validate_certs | default(false) }}"
      # Without this, the collection's HTTP calls have no ceiling: a request
      # that stalls mid-run blocks the job indefinitely instead of failing.
      # Raise it with -e aap_request_timeout=<seconds> for very large runs.
      request_timeout: "{{ aap_request_timeout | default(60) }}"
  tasks:
    - name: notify_patch_success
      ansible.controller.notification_template:
        name: notify_patch_success
        organization: Default
        notification_type: email
        notification_configuration:
          host: "{{ smtp_host | default('smtp.example.com') }}"
          port: 25
          use_tls: false
          use_ssl: false
          sender: aap-patching@example.com
          recipients: ["windows-admins@example.com"]
          username: ""
          password: ""

    - name: notify_patch_failure
      ansible.controller.notification_template:
        name: notify_patch_failure
        organization: Default
        notification_type: email
        notification_configuration:
          host: "{{ smtp_host | default('smtp.example.com') }}"
          port: 25
          use_tls: false
          use_ssl: false
          sender: aap-patching@example.com
          recipients: ["windows-admins-oncall@example.com"]
          username: ""
          password: ""

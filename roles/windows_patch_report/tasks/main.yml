---
# Facts reach this role by one of two routes.
#
# Under an AAP workflow, Scan and Install each run as their own job template in
# their own container with its own AWX_PRIVATE_DATA_DIR. The .scan.json and
# .install.json files they write are destroyed with that container, so this job
# can never read them off disk — the facts arrive as workflow artifacts instead
# (published via set_stats, injected here as extra_vars).
#
# Run standalone via 99_full_cycle.yml, all three plays share one control node,
# so the on-disk files are present and there are no artifacts. Prefer artifacts,
# fall back to disk.
- name: Collect facts delivered as workflow artifacts
  ansible.builtin.set_fact:
    artifact_facts: >-
      {{ (patch_scan_facts | default([])) + (patch_install_facts | default([])) }}

- name: Read facts from disk when not running under a workflow
  when: artifact_facts | length == 0
  block:

    - name: Locate patch-fact files written by scan and install plays
      ansible.builtin.find:
        paths: "{{ patch_facts_dir }}"
        patterns: ["*.scan.json", "*.install.json"]
        recurse: false
      register: fact_files

    - name: Read all fact files content
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: "{{ fact_files.files | map(attribute='path') | list }}"
      register: slurped

    - name: Decode on-disk facts
      ansible.builtin.set_fact:
        disk_facts: >-
          {{ slurped.results
             | map(attribute='content')
             | map('b64decode')
             | map('from_json')
             | list }}

- name: Settle on the fact source for this run
  ansible.builtin.set_fact:
    all_facts: >-
      {{ artifact_facts if artifact_facts | length > 0
         else (disk_facts | default([])) }}

- name: Fail loudly if no facts were found
  ansible.builtin.fail:
    msg: |
      No patch facts available to report on.

      Under an AAP workflow the Scan node publishes them as artifacts — check
      that its "Publish eligible host list to downstream workflow nodes" task
      ran, and that this job template has ask_variables_on_launch enabled so
      artifacts are accepted.

      Running standalone, this role reads {{ patch_facts_dir }} instead; run
      the Scan play (and optionally Install) first, in the same job.
  when: all_facts | length == 0

- name: Group facts by host
  ansible.builtin.set_fact:
    fleet_facts: "{{ all_facts | groupby('hostname') }}"

- name: Compute per-host posture
  ansible.builtin.set_fact:
    host_postures: >-
      {{ host_postures | default([]) +
         [ {'hostname': item.0,
            'data': item.1,
            'posture': item.1 | posture_grade_host(posture_weights, posture_thresholds, os_lifecycle) } ] }}
  loop: "{{ fleet_facts }}"
  loop_control:
    label: "{{ item.0 }}"

- name: Compute fleet posture
  ansible.builtin.set_fact:
    fleet_posture: "{{ host_postures | posture_grade_fleet(posture_weights, posture_thresholds) }}"

- name: Identify top risks
  ansible.builtin.set_fact:
    top_risks: "{{ host_postures | top_risks_ranking(top_risks_count) }}"

- name: Generate timestamp for report filenames
  ansible.builtin.set_fact:
    report_stamp: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"

- name: Render HTML report
  ansible.builtin.template:
    src: report.html.j2
    dest: "{{ report_output_dir }}/posture-report-{{ report_stamp }}.html"
    mode: '0644'

- name: Render CSV report
  ansible.builtin.template:
    src: report.csv.j2
    dest: "{{ report_output_dir }}/posture-report-{{ report_stamp }}.csv"
    mode: '0644'

- name: Render email summary (HTML body)
  ansible.builtin.template:
    src: email_summary.html.j2
    dest: "{{ report_output_dir }}/email-summary-{{ report_stamp }}.html"
    mode: '0644'

- name: Convert recipient survey input into a list
  ansible.builtin.set_fact:
    report_recipients: "{{ (report_recipients_raw | default('')).split(',') | map('trim') | select | list }}"
  when: report_recipients_raw is defined

- name: Send email summary
  community.general.mail:
    host: "{{ smtp_host }}"
    port: "{{ smtp_port | default(25) }}"
    username: "{{ smtp_user | default(omit) }}"
    password: "{{ smtp_password | default(omit) }}"
    secure: "{{ smtp_secure | default('try') }}"
    sender: "{{ smtp_from | default('aap-patching@' + ansible_fqdn | default('example.com')) }}"
    to: "{{ report_recipients }}"
    subject: "[AAP] Windows Patch Posture — Grade {{ fleet_posture.grade }} ({{ fleet_posture.score }}/100)"
    subtype: html
    body: "{{ lookup('file', report_output_dir + '/email-summary-' + report_stamp + '.html') }}"
    attach:
      - "{{ report_output_dir }}/posture-report-{{ report_stamp }}.csv"
  when:
    - smtp_host is defined
    - report_recipients | length > 0

- name: Surface report summary to AAP UI via set_stats
  ansible.builtin.set_stats:
    data:
      fleet_grade: "{{ fleet_posture.grade }}"
      fleet_score: "{{ fleet_posture.score }}"
      hosts_total: "{{ host_postures | length }}"
      hosts_compliant: "{{ host_postures | selectattr('posture.grade', 'in', ['A', 'B']) | list | length }}"
      report_html: "{{ report_output_dir }}/posture-report-{{ report_stamp }}.html"
    per_host: false
    aggregate: false

[defaults]
inventory               = ./inventories/production/hosts.yml
collections_path        = ./collections
roles_path              = ./roles
filter_plugins          = ./filter_plugins
host_key_checking       = False
retry_files_enabled     = False
stdout_callback         = yaml
forks                   = 20
gathering               = smart
fact_caching            = jsonfile
fact_caching_connection = ./.fact_cache
fact_caching_timeout    = 7200

[inventory]
# 'script' and 'host_list' must stay enabled: AAP writes the job's inventory to
# /runner/inventory/hosts as an executable Python script that emits JSON. Setting
# enable_plugins without 'script' makes every AAP job fail with
# "No inventory was parsed" before the first task runs.
enable_plugins = host_list, script, auto, yaml, ini, toml, constructed

[persistent_connection]
command_timeout = 60
connect_timeout = 60

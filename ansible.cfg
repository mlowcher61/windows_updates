[defaults]
inventory               = ./inventories/production/hosts.yml
collections_path        = ./collections
roles_path              = ./roles
filter_plugins          = ./filter_plugins
host_key_checking       = False
retry_files_enabled     = False
# 'yaml' here resolved to community.general.yaml, which was REMOVED in
# community.general 12.0.0. requirements.yml floors that collection at 8.0.0,
# so an EE built today pulls a version without it and every job dies at
# startup with "callback plugin has been removed". The built-in default
# callback has produced the same YAML-formatted output since ansible-core
# 2.13 via callback_result_format below.
#
# NB: the ini key is callback_result_format, NOT result_format — the option
# is documented as 'result_format' in `ansible-doc -t callback default`, but
# its ini key differs, and a wrong key here is silently ignored (output just
# stays JSON) rather than erroring.
stdout_callback         = default
callback_result_format  = yaml
forks                   = 20
gathering               = smart
fact_caching            = jsonfile
fact_caching_connection = ./.fact_cache
fact_caching_timeout    = 7200

[inventory]
# 'script' and 'host_list' must stay enabled: AAP writes the job's inventory to
# /runner/inventory/hosts as an executable Python script that emits JSON. Setting
# enable_plugins without 'script' makes every AAP job fail with
# "No inventory was parsed" before the first task runs.
enable_plugins = host_list, script, auto, yaml, ini, toml, constructed

[persistent_connection]
command_timeout = 60
connect_timeout = 60

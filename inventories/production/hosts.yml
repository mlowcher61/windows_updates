---
# Production inventory — for LOCAL ansible-core / CLI runs only.
#
# Under AAP the inventory comes from the platform ("AWS Inventory", attached to
# each job template), never from this file. Nothing in aap/ reads it, and AAP
# does not load the group_vars/ beside it either — it writes its own inventory
# to /runner/inventory/. Keep this in sync only if you run the playbooks by hand.
#
# Three groups drive behaviour:
#   - prod      : approval gate enforced, install Security+Critical only
#   - dev       : no approval, install all categories
#   - sensitive : scan-only — never installs
all:
  children:
    windows_servers:
      children:
        prod:
          hosts:
            winsrv-prod-01.example.com:
            winsrv-prod-02.example.com:
        dev:
          hosts:
            winsrv-dev-01.example.com:
        sensitive:
          hosts:
            winsrv-pci-01.example.com:
    # Linux host serving the rendered posture reports over nginx. Sits outside
    # windows_servers so it never lands in a patch play's host pattern.
    #
    # Which of these serves reports is chosen by report_web_host — set it to a
    # host name from this group (report-web-01) to pin one box, or leave it at
    # the default 'report_hosts' to publish to every member. On the CLI, pass it
    # explicitly:
    #   ansible-playbook playbooks/03_report.yml -e report_web_host=report-web-01
    #
    # Under AAP this group is irrelevant: report_web_host comes from the job
    # template survey and resolves against AWS Inventory, where you create the
    # matching report_hosts group.
    report_hosts:
      hosts:
        report-web-01:
          ansible_host: 18.145.173.137

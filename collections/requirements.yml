---
# Certified / Validated content (Red Hat preferred per global instructions)
collections:
  # Certified — Red Hat
  - name: ansible.windows
    version: ">=2.4.0"
  # Controller resources (job templates, projects, credentials, inventories,
  # schedules, notifications). ansible.platform does NOT ship these modules --
  # it only covers gateway/identity objects (org, team, user, role, service*).
  - name: ansible.controller
    version: ">=4.5.0"
  # Gateway/identity objects. Kept for future org/team/role automation.
  - name: ansible.platform
    version: ">=2.5.0"
  # Validated — Red Hat
  - name: community.windows
    version: ">=2.2.0"
  # Required for community.general.mail
  - name: community.general
    version: ">=8.0.0"
